language: id
depot: Riau
speed_kmh: 200
detour_factor: 1.15
dwell_hours: 1.0
time_limit_hours: 72  # Batas waktu misi; dikalibrasi greedy n=38 skenario 2026 (python -m src.calibration)
gamma: 0.8
weights: {hist: 0.4, cur: 0.3, ops: 0.3}
decay_g0: 0.01
decay_kappa: 1.0
evaluation_budget:  # budget evaluasi fitness per run, sama untuk semua algoritma
  small: 20000      # n <= small_max_n
  large: 50000      # n > small_max_n
  small_max_n: 15
seeds: 30
analysis:  # analisis lanjutan (#5); ditetapkan sebelum melihat hasil
  sensitivity:  # satu parameter diubah, yang lain tetap di nilai default di atas
    n: 38
    scenario: "2026"
    time_limit_hours: [24, 48, 72, 120]
    decay_g0: [0, 0.005, 0.01, 0.02]
  case_study: {n: 38, scenario: "2026"}  # peta rute & ablasi decay
quick:  # mode cepat (--quick) untuk smoke test
  sizes: [6, 10]
  seeds: 3
  budget: 300
  sensitivity_n: 10  # menggantikan analysis.sensitivity.n dan analysis.case_study.n
firms:  # fase 2: Klaster hotspot NASA FIRMS (#6, ADR-0001); ditetapkan sebelum melihat hasil
  snapshot: data/external/firms/SUOMI_VIIRS_C2_SouthEast_Asia_7d_2026-10-20.csv  # relatif ke root repo
  confidence: [nominal, high]
  bboxes:  # [lat_min, lat_max, lon_min, lon_max]; ASSUMED, kotak kasar pulau
    Sumatra: [-6.0, 6.0, 95.0, 106.0]
    Kalimantan: [-4.5, 4.5, 108.5, 119.0]
  sizes: [50, 100, 200]  # k Klaster hotspot (instance = k node + Depot)
  kmeans_seed: 0
  budget: 100000
  calibration_k: 100  # Batas waktu misi dikalibrasi sekali (greedy, utilitas yang sama) lalu dipakai semua k
  map_k: 100
  quick: {sizes: [3, 6], seeds: 2, budget: 300}
